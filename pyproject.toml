[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guideai"
version = "0.1.0"
description = "AI-powered desktop voice assistant and real-time screen guidance overlay"
authors = [{ name = "Karthik Sambhu R", email = "karthiksambhu123@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "sounddevice",
    "pywhispercpp",
    "pynput",
    "pyautogui",
    "pygetwindow",
    "mss",
    "Pillow",
    "python-dotenv",
]

[project.scripts]
guideai = "app:main"
